  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />

  <link rel="manifest" href="/site.webmanifest" />

  <meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0b10" media="(prefers-color-scheme: dark)" />

  <!-- Per-page title, description, canonical and social tags are injected at
       build time by scripts/prerender.mjs. -->
  <!--page-head-->

  <!-- Structured data (injected at build time by scripts/prerender.mjs) -->

  <script defer src="https://cloud.umami.is/script.js" data-website-id="6b32c0a9-7f49-481a-8fc1-a95133286f30"></script>

  <script>
    try {
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (_) { }
  </script>

  <noscript>
    <style>
      .reveal {
        opacity: 1 !important;
        transform: none !important;
      }
    </style>
  </noscript>
</head>

  <div id="root"></div>
  <script type="module" src="/src/blog.tsx"></script>
</body>

</html>
