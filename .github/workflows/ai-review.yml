# .github/workflows/ai-review.yml
name: AI Review (on demand)
on:
  issue_comment:
    types: [created]

jobs:
  ai_review:
    # Runs ONLY when a repo member types /review on a PR. Nothing automatic.
    if: >-
      ${{ github.event.issue.pull_request
          && github.event.sender.type != 'Bot'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          && (github.event.comment.body == '/review'
              || startsWith(github.event.comment.body, '/review ')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Run pr-agent review
        uses: The-PR-Agent/pr-agent@1d01f24f455bb879c1d9c557ad7de3d72dcc7975   # v0.46.0, pinned SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Primary: OpenRouter free models (your chosen lineup)
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONFIG__MODEL: "openrouter/qwen/qwen3.8-27b:free"
          CONFIG__FALLBACK_MODELS: '["openrouter/nvidia/nemotron-3-ultra-550b-a55b:free","openrouter/stealth/space-bunny-alpha","openrouter/thinkingmachines/inkling:free","openrouter/cohere/north-mini-code:free","openrouter/poolside/laguna-s-2.1:free","openrouter/openrouter/free","groq/openai/gpt-oss-120b","azure/${{ secrets.AZURE_OPENAI_DEPLOYMENT_LUNA }}"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "128000"
          GROQ__API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Azure Foundry last resort (only fires when every free tier fails)
          OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY_LUNA }}
          OPENAI.API_TYPE: "azure"
          OPENAI.API_VERSION: "2025-03-01-preview"
          OPENAI.API_BASE: ${{ secrets.AZURE_OPENAI_ENDPOINT_LUNA }}
          OPENAI.DEPLOYMENT_ID: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_LUNA }}
          # Noise control: cap findings, keep one persistent comment
          PR_REVIEWER.NUM_MAX_FINDINGS: "5"
          PR_REVIEWER.PERSISTENT_COMMENT: "true"
